
name: Update GrandChase feed

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore previous RSS feed
        run: |
          mkdir -p site
          curl --fail --silent --show-error --location \
            --retry 3 \
            "https://zeteheme.github.io/gcdcfeed/feed.xml" \
            --output site/feed.xml || {
              echo "No previous feed found. Skipping first-run backlog."
              rm -f site/feed.xml
            }

      - name: Build feed and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 grandchase_feed.py --output site/feed.xml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
